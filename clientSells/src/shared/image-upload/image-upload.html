
<div class="flex w-7/8 gap-30 min-h-100 justify-center">
  <!-- h-60  w-3/8 -->

  <div class="flex items-center gap-4 h-70">

    <label (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)"
      [class.border-purple-600]="isDragging" [class.border-5]="isDragging" [class.bg-purple-90]="isDragging"
      for="dropzone-file" class="flex flex-col items-center justify-center w-full border-2
       border-gray-300 h-full border-dashed rounded-lg  cursor-pointer">
      <p class="mb-2 text-lg">Click to upload or drag and drop</p>
      <input type="file" id="dropzone-file" class="hidden">
    </label>
  </div>

  @if (imgSource()) {

  <div class="flex flex-col w-1/4 gap-3">
    <!-- <span class="flex flex-col items-center">Imagen Previa</span> -->
    <div class="flex justify-center border-2 border-gray-300 rounded-lg">
      <img src="{{imgSource()}}" alt="image preview" class="aspect-square object-cover rounded-lg">
    </div>
    <div class="flex w-full gap-3">
      <button (click)="onCancel()" class="btn flex-1">Cancel
      </button>
      <button (click)="onUploadFile()" [disabled]="loading()" class="btn btn-primary">
        @if(loading()){
        <span class="loading loading-spinner"></span>
        }
        Guardar Imagen
      </button>
    </div>
  </div>
  }

</div>
