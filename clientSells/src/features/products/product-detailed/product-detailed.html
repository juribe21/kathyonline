@if (product(); as product) {
<div class="flex gap-6">
  <div class=" card bg-base-100 flex flex-col h-[85vh] w-3/16">
    <img src="{{product.productImageUrl || '/user.png'}}" alt="iamge of member"
      class="rounded-4xl mx-10 mt-3 object-cover">
    <div class="card-body">
      <div class="flex flex-col items-center">
        <div class="flex text-2xl text-primary">
          {{product.productName}}
        </div>
      </div>

      <div class="card-body">
        <div class="flex flex-col items-center">
          <div class="text-md">
            En existencia: {{product.cantidad}}
          </div>
        </div>
        <div class="divider"></div>
        <ul class="menu rounded-box w-full text-sm">
          <li><a routerLink="foto" routerLinkActive="text-primary" class="justify-between">Fotos
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
              </svg>

            </a></li>
          <!-- <li><a routerLink="descripcion" routerLinkActive="text-primary">Descripcion</a></li> -->
          <li>

            <a routerLink="carrito" routerLinkActive="text-primary" class="justify-between"> Carrito
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
              </svg>
            </a>
          </li>
        </ul>

      </div>

      <div class="card-actions justify-between gap-2 px-2 mb-3">
        <button (click)="Cancel()" class="btn btn-info flex-2">Atras</button>
        <button (click)="AgregarCarrito()" class="btn btn-primary flex-4 text-sm">Comprar</button>
      </div>
    </div>
  </div>

  <div class="card bg-base-100 w-7/8 p-6">
    <div class="flex justify-between items-center">
      <h3 class="card-title text-3xl text-primary">{{productName()}}</h3>
      @if(isCurrentUser()){
      <!-- <button (click)="adminService.editMode.set(!adminService.editMode())" class="btn btn-outline-info btn-primary">
        {{adminService.editMode()? 'Cancel':'Edit'}}
      </button> -->
      }
    </div>

    <div class="divider"></div>
    <div>
      <router-outlet />
    </div>
  </div>

</div>
} @else {
<div>Member not found</div>
}
