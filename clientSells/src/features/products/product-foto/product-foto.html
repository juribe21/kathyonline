@if (product(); as product) {
<div class="flex flex-col gap-3">
  <div class="flex gap-3">
    <span class="font-semibold">Precio:</span>
    <span>$ {{product.precio}}</span>
  </div>
  <h3 class="text-lg font-semibold text-primary">
    Acerca del producto:
  </h3>

  <div class="ml-90">
    <!-- <img src="{{product.productImageUrl}}" width="350px" alt="{{product.productName}}"> -->
  </div>
  <div class="mb-5">{{product.description}}</div>
</div>

@if (photos$ | async; as fotos) {
@if (fotos.length > 0) {
<div class="grid grid-cols-3 align-middle auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
  @for (foto of fotos; track foto.id) {
  <img src="{{foto.url}}" alt="{{product.productName}}" class="w-7/8 gap-3 rounded-lg">
  }
</div>
}
}

}
