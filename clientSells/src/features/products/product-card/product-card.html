@if(product(); as product) {
<div routerLink="/products/{{product.id}}"
  class="card cursor-pointer transition-all duration-300 ease-in-out
  transform hover:-translate-y-3">
  <img src="{{product.productImageUrl || '/user.png'}}" alt="{{product.productName}}" class="rounded-lg">
  @if (accountService.adminUser()) {
      <button (click)="deleteProduct($event, product.id)" class="absolute top-1 right-1 z-50 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="red" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
          class="size-8 stroke-2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
        </svg>
      </button>
  }

  <div class="card-actions bg-black z-50 absolute bottom-0 w-full  px-3 py-1 rounded-b-lg">
    <div class="flex flex-col text-white">
      <span class="font-semibold">{{product.productName}}</span>
      <span class="text-sm">{{product.cantidad}} {{product.precio}}</span>
    </div>
  </div>
</div>
}
