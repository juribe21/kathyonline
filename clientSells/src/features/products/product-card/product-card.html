@if(product(); as product) {
<div routerLink="/products/{{product.id}}"
  class="card cursor-pointer transition-all duration-300 ease-in-out
  transform hover:-translate-y-3">
  <img src="{{product.productImageUrl || '/user.png'}}" alt="{{product.productName}}" class="rounded-lg">
  <div class="card-actions bg-black z-50 absolute bottom-0 w-full  px-3 py-1 rounded-b-lg">
    <div class="flex flex-col text-white">
      <span class="font-semibold">{{product.productName}}</span>
      <span class="text-sm">{{product.cantidad}} {{product.precio}}</span>
    </div>
  </div>
</div>
}
