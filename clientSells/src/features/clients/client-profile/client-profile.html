@if (adminService.client(); as client) {
<div class="flex flex-col gap-3">
  <div class="flex gap-3">
    <span class="font-semibold">Cliente desde:</span>
    <span>{{client.created | date: 'longDate'}} </span>
  </div>
  <div class="flex gap-3">
    <span class="font-semibold">Ultimo acceso:</span>
    <span>{{client.lastActive | date: 'dd MMM yyyy'}}</span>
  </div>
  <h3 class="text-lg font-semibold text-primary">About: {{client.name}} {{client.lastName}}</h3>
  @if (adminService.editMode()) {
  <form #editForm="ngForm" (ngSubmit)="updateProfile()" class="flex flex-col w-full gap-4">
    <label class="floating-label">
      <span>Nombre(s)</span>
      <input class="input w-full" name="displayName" [(ngModel)]="editableClient.name" placeholder="nombre(s)">
    </label>

    <label class="floating-label">
      <span>Apellidos</span>
      <input class="input w-full" name="lastName" [(ngModel)]="editableClient.lastName" placeholder="apellidos">
    </label>

    <label class="floating-label">
      <span>Correo</span>
      <input class="input w-full" name="email" [(ngModel)]="editableClient.email" placeholder="email">
    </label>

    <label class="floating-label">
      <span>Telefono</span>
      <input class="input w-full" name="telefono" [(ngModel)]="editableClient.telefono" placeholder="telefono">
    </label>

    <label class="floating-label">
      <span>Descripcion</span>
      <textarea class="input w-full" name="description" [(ngModel)]="editableClient.description"
        placeholder="descripcion"></textarea>
    </label>

    <div class="flex self-end">
      <button [disabled]="!editForm.dirty" type="submit" class="btn btn-success">
        Submit
      </button>
    </div>
  </form>
  } @else {
  <div>{{client.description}}</div>
  }

</div>
}
