@if (accountService.adminUser()) {
<div class="flex flex-col h-[95vh]">
  <form>
    <div class="grid grid-cols-3 gap-6">
      <label class="floating-label">
        <span>Nombre Producto</span>
        <input class="input w-full" name="displayName" placeholder="Nombre Producto">
      </label>

      <label class="floating-label">
        <span>Precio</span>
        <input class="input w-full" name="displayName" placeholder="Precio">
      </label>

      <label class="floating-label">
        <span>Cantidad</span>
        <input class="input w-full" name="lastName" placeholder="Cantidad">
      </label>
    </div>

    <div class="grid grid-col-3 gap-3 mt-3">
      <label class="floating-label">
        <span>descripcion</span>
        <textarea class="input w-full" name="descripcion" placeholder="descripcion"></textarea>
      </label>
      <label class="floating-label">
        <span>Direccion Imagen</span>
        <input class="input w-full" name="urlimg" placeholder="Url imagen">
      </label>
    </div>
  </form>

  <div class="mt-3">
    <div class="flex gap-3 justify-center py-3">
      <span>Fotos</span>
    </div>
    <div class="flex gap-3 justify-center">
      <img src="/user.png" alt="" width="100">
      <img src="/user.png" alt="" width="100">
      <img src="/user.png" alt="" width="100">
    </div>
  </div>

  <div class="mt-5">
    <app-image-upload (uploadFile)="onUploadImafe($event)" [loading]="loading()" />
  </div>
</div>


}
