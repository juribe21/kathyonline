@if (accountService.adminUser()) {
<div class="flex gap-6">
  <div class=" card bg-base-100 flex flex-col h-[85vh] w-1/4">

    <div class="card-body">
      <div class="flex flex-col items-center">
        <span class="text-lg">Administracion de Productos</span>
      </div>

      <div class="card-body">
        <!-- <div class="flex flex-col items-center">
            <div class="text-sm">
              {{client.city}}, {{client.country}}
            </div>
          </div>
          <div class="divider"></div>-->
        <ul class="menu rounded-box w-full text-sm">
          <!-- Agregar Producto -->
          <li><a routerLink="addproduct" routerLinkActive="text-primary" class="justify-between mt-2 mb-2">Agregar
              Producto
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </a></li>

          <!-- Pedidos -->
          <li><a routerLink="pedidos" routerLinkActive="text-primary" class="justify-between mb-2">Pedidos
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
            </a></li>

          <!-- Lista de Fotos deeproduto nuevo-->
          <li><a routerLink="foto" routerLinkActive="text-primary" class="justify-between mb-3">Fotos
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
              </svg>
            </a></li>

          <!-- Compras -->
          <!-- <li><a routerLink="compras" routerLinkActive="text-primary" class="justify-between mb-3">Compras
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
              </svg>
            </a></li> -->

          <!-- Carrito -->
          <li><a routerLink="carrito" routerLinkActive="text-primary" class="justify-between mb-3">Carrito
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
              </svg>
            </a></li>

          <!-- Eliminar Producto -->
          <li><a routerLink="eliminarproducto" routerLinkActive="text-primary"
              class="justify-between mb-3 text-red-600">Eliminar Producto
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </a></li>
        </ul>

      </div>

      <div class="card-actions justify-between gap-2 px-2 mb-3">
        <button class="btn btn-info flex-2">Atras</button>
        <button class="btn btn-primary flex-4 text-sm">Enviar Mensaje</button>
      </div>
    </div>
  </div>

  <!-- Parte derecha -->
  <div class="card bg-base-100 w-7/8 p-6">
    <div class="flex justify-between items-center">
      <h3 class="card-title text-3xl text-primary">{{title()}}</h3>
      <button class="btn btn-primary">Edit</button>

      <!-- @if(accountService.adminUser() || isCurrentUser()){
          <button (click)="adminService.editMode.set(!adminService.editMode())" class="btn btn-outline-info btn-primary">
            {{adminService.editMode()? 'Cancel':'Edit'}}
          </button>
          } -->
    </div>

    <div class="divider"></div>
    <div>
      <router-outlet />
    </div>
  </div>

</div>
} @else {
<div>Client not found</div>
}
